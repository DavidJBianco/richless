name: Tests

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install Linux pager and shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y less bash zsh
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python '${{ matrix.python }}'
      - name: Required correctness and compatibility tests
        env:
          RICHLESS_AUDIT_DIR: ${{ runner.temp }}/richless-evidence
        run: uv run --frozen pytest tests/ -q --junitxml=results.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            results.xml
            ${{ runner.temp }}/richless-evidence

  quality:
    name: Code and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy richless.py
      - run: uv build
      - name: Installed distribution upgrade and rollback checks
        run: uv run --frozen python audit/verify-distributions.py
      - name: Installed wheel smoke test
        run: |
          uv venv /tmp/richless-installed
          uv pip install --python /tmp/richless-installed/bin/python dist/*.whl
          cd /tmp
          /tmp/richless-installed/bin/richless --init-path
          printf '# Installed\n\n**works**\n' | /tmp/richless-installed/bin/richless --md -

  required:
    name: Required checks
    if: always()
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$TEST_RESULT" = success && test "$QUALITY_RESULT" = success
